<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="780" height="980" viewBox="0 0 780 980"><rect x="0" y="0" width="780" height="980" rx="0" fill="#FAF4F1"/><text x="45" y="50" font-family="Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="2" fill="#76636B">ELINS VAL  /  BESLUTSGUIDE</text><text x="45" y="112" fill="#582B39" font-family="Georgia, sans-serif" font-size="34" font-weight="400"><tspan x="45" dy="0">maria nila Shaping Heat Spray – hur</tspan><tspan x="45" dy="42">många grader skyddar den?</tspan></text><rect x="45" y="300" width="690" height="260" rx="20" fill="#FFFCFA"/><text x="75" y="342" font-family="Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="2" fill="#582B39">PASSAR DIG OM</text><text x="75" y="395" fill="#30272B" font-family="Arial, sans-serif" font-size="31" font-weight="400"><tspan x="75" dy="0">Du stylar torrt hår med värme och vill</tspan><tspan x="75" dy="39">ha lätt stadga.</tspan></text><rect x="45" y="590" width="690" height="260" rx="20" fill="#F0DDD7"/><text x="75" y="632" font-family="Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="2" fill="#582B39">KONTROLLERA FÖRST</text><text x="75" y="685" fill="#30272B" font-family="Arial, sans-serif" font-size="31" font-weight="400"><tspan x="75" dy="0">Välj ett annat alternativ om du kräver</tspan><tspan x="75" dy="39">en uttryckligt angiven</tspan><tspan x="75" dy="39">skyddstemperatur eller söker en</tspan><tspan x="75" dy="39">oparfymerad spray.</tspan></text><text x="45" y="925" fill="#76636B" font-family="Arial, sans-serif" font-size="24" font-weight="400"><tspan x="45" dy="0">Källor och fullständiga villkor finns i guiden.</tspan></text></svg>