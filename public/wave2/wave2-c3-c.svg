<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="780" height="1510" viewBox="0 0 780 1510"><rect x="0" y="0" width="780" height="1510" rx="0" fill="#FAF4F1"/><text x="45" y="48" font-family="Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="2" fill="#76636B">ELINS VAL  /  VÄLJ EFTER DIN RUTIN</text><text x="45" y="108" fill="#582B39" font-family="Georgia, sans-serif" font-size="33" font-weight="400"><tspan x="45" dy="0">Olaplex No.7 eller Kérastase Elixir</tspan><tspan x="45" dy="41">Ultime – bonding oil eller klassisk</tspan><tspan x="45" dy="41">hårolja?</tspan></text><rect x="45" y="350" width="690" height="330" rx="18" fill="#F0DDD7"/><text x="75" y="393" fill="#582B39" font-family="Arial, sans-serif" font-size="27" font-weight="400"><tspan x="75" dy="0">Jämförd volym</tspan></text><text x="75" y="450" fill="#30272B" font-family="Arial, sans-serif" font-size="27" font-weight="400"><tspan x="75" dy="0">Olaplex No.7: 30 ml</tspan></text><text x="75" y="570" fill="#30272B" font-family="Arial, sans-serif" font-size="27" font-weight="400"><tspan x="75" dy="0">Kérastase Elixir Ultime L’Huile Originale:</tspan><tspan x="75" dy="34">30 ml</tspan></text><rect x="45" y="700" width="690" height="330" rx="18" fill="#FFFCFA"/><text x="75" y="743" fill="#582B39" font-family="Arial, sans-serif" font-size="27" font-weight="400"><tspan x="75" dy="0">Användning</tspan></text><text x="75" y="800" fill="#30272B" font-family="Arial, sans-serif" font-size="27" font-weight="400"><tspan x="75" dy="0">Olaplex No.7: Fuktigt eller torrt hår; före</tspan><tspan x="75" dy="34">eller efter styling</tspan></text><text x="75" y="920" fill="#30272B" font-family="Arial, sans-serif" font-size="27" font-weight="400"><tspan x="75" dy="0">Kérastase Elixir Ultime L’Huile Originale:</tspan><tspan x="75" dy="34">Vått eller torrt hår; även som finish</tspan></text><rect x="45" y="1050" width="690" height="330" rx="18" fill="#F0DDD7"/><text x="75" y="1093" fill="#582B39" font-family="Arial, sans-serif" font-size="27" font-weight="400"><tspan x="75" dy="0">Dosinformation</tspan></text><text x="75" y="1150" fill="#30272B" font-family="Arial, sans-serif" font-size="27" font-weight="400"><tspan x="75" dy="0">Olaplex No.7: 2–3 droppar enligt Olaplex</tspan></text><text x="75" y="1270" fill="#30272B" font-family="Arial, sans-serif" font-size="27" font-weight="400"><tspan x="75" dy="0">Kérastase Elixir Ultime L’Huile Originale:</tspan><tspan x="75" dy="34">Följ flaskans dosering; ingen säker</tspan><tspan x="75" dy="34">omräkning till ml</tspan></text><text x="45" y="1453" fill="#76636B" font-family="Arial, sans-serif" font-size="24" font-weight="400"><tspan x="45" dy="0">Kontrollera källor och rätt variant i guiden.</tspan></text></svg>