<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="780" height="980" viewBox="0 0 780 980"><rect x="0" y="0" width="780" height="980" rx="0" fill="#FAF4F1"/><text x="45" y="50" font-family="Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="2" fill="#76636B">ELINS VAL  /  BESLUTSGUIDE</text><text x="45" y="112" fill="#582B39" font-family="Georgia, sans-serif" font-size="34" font-weight="400"><tspan x="45" dy="0">Tynger arganolja fint hår? maria nila</tspan><tspan x="45" dy="42">True Soft – 30 eller 100 ml?</tspan></text><rect x="45" y="300" width="690" height="260" rx="20" fill="#FFFCFA"/><text x="75" y="342" font-family="Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="2" fill="#582B39">PASSAR DIG OM</text><text x="75" y="395" fill="#30272B" font-family="Arial, sans-serif" font-size="31" font-weight="400"><tspan x="75" dy="0">Du vill ha en oljeblandning som kan</tspan><tspan x="75" dy="39">användas på både handdukstorkade och</tspan><tspan x="75" dy="39">torra längder.</tspan></text><rect x="45" y="590" width="690" height="260" rx="20" fill="#F0DDD7"/><text x="75" y="632" font-family="Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="2" fill="#582B39">KONTROLLERA FÖRST</text><text x="75" y="685" fill="#30272B" font-family="Arial, sans-serif" font-size="31" font-weight="400"><tspan x="75" dy="0">Avstå om du söker ren arganolja eller</tspan><tspan x="75" dy="39">behöver en garanti för att fint hår</tspan><tspan x="75" dy="39">inte tyngs ned.</tspan></text><text x="45" y="925" fill="#76636B" font-family="Arial, sans-serif" font-size="24" font-weight="400"><tspan x="45" dy="0">Källor och fullständiga villkor finns i guiden.</tspan></text></svg>